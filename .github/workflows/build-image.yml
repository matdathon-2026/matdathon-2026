name: Build and push image

# Builds the container image on a GitHub-hosted runner (which has Docker) and
# pushes it to Azure Container Registry. This subscription blocks ACR Tasks
# (TasksOperationsNotAllowed), so cloud-side `az acr build` is unavailable and
# the build has to happen here.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/didimheart:${{ github.sha }}
            ${{ secrets.ACR_LOGIN_SERVER }}/didimheart:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "Pushed ${{ secrets.ACR_LOGIN_SERVER }}/didimheart:${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
